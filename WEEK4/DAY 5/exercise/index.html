<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3 - Starship Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-900 to-blue-800 min-h-screen p-4 md:p-8">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-xl shadow-lg p-8">
            <h1 class="text-4xl font-bold text-blue-800 mb-1">Exercise 3</h1>
            <h2 class="text-2xl text-gray-800 mb-6 font-semibold">Star Wars Starship Data Fetcher</h2>
            
            <p class="text-gray-700 mb-6 text-base font-medium">Fetching data from Star Wars API (SWAPI) using async/await</p>
            
            <button onclick="getStarship()" class="bg-blue-700 hover:bg-blue-800 text-white px-8 py-3 rounded-lg font-bold text-lg transition w-full shadow-lg">
                Fetch Starship Data
            </button>
            
            <div id="result" class="mt-6 bg-gray-50 p-6 rounded-lg border-2 border-gray-300 min-h-40">
                <p class="text-gray-800 font-semibold text-lg">Click the button to fetch starship data...</p>
            </div>
        </div>
    </div>

    <script>
        async function getStarship() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p class="text-gray-800 font-semibold text-lg">Loading...</p>';
            
            try {
                const response = await fetch("https://www.swapi.tech/api/starships/9/");

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const objectStarWars = await response.json();
                console.log("Exercise 3 Result:", objectStarWars.result);
                
                // Display the result - data is in result.properties
                const starship = objectStarWars.result.properties;
                resultDiv.innerHTML = `
                    <div class="space-y-4">
                        <div class="bg-white p-5 rounded-lg border-l-4 border-blue-700 shadow-md">
                            <h3 class="font-bold text-2xl text-blue-800 mb-4">${starship.name || 'Unknown'}</h3>
                            <div class="space-y-3 text-gray-900">
                                <p><span class="font-bold text-gray-800">Model:</span> <span class="text-base">${starship.model || 'N/A'}</span></p>
                                <p><span class="font-bold text-gray-800">Manufacturer:</span> <span class="text-base">${starship.manufacturer || 'N/A'}</span></p>
                                <p><span class="font-bold text-gray-800">Class:</span> <span class="text-base">${starship.starship_class || 'N/A'}</span></p>
                                <p><span class="font-bold text-gray-800">Cost in Credits:</span> <span class="text-base">${starship.cost_in_credits || 'N/A'}</span></p>
                                <p><span class="font-bold text-gray-800">Length:</span> <span class="text-base">${starship.length || 'N/A'} meters</span></p>
                                <p><span class="font-bold text-gray-800">Crew:</span> <span class="text-base">${starship.crew || 'N/A'}</span></p>
                            </div>
                        </div>
                        <p class="text-sm text-green-700 font-semibold text-center">✓ Data fetched successfully!</p>
                    </div>
                `;
            } catch (error) {
                console.error("Could not fetch starship data:", error);
                resultDiv.innerHTML = `<p class="text-red-700 font-bold text-lg">❌ Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
