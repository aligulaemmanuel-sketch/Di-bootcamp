<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3 - Starship Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-900 to-blue-800 min-h-screen p-4 md:p-8">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-xl shadow-lg p-8">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">Exercise 3</h1>
            <h2 class="text-xl text-gray-600 mb-6">Star Wars Starship Data Fetcher</h2>
            
            <p class="text-gray-600 mb-6">Fetching data from Star Wars API (SWAPI) using async/await</p>
            
            <button onclick="getStarship()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-semibold transition w-full">
                Fetch Starship Data
            </button>
            
            <div id="result" class="mt-6 bg-gray-50 p-6 rounded-lg border border-gray-200 min-h-40">
                <p class="text-gray-500">Click the button to fetch starship data...</p>
            </div>
        </div>
    </div>

    <script>
        async function getStarship() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p class="text-gray-600">Loading...</p>';
            
            try {
                const response = await fetch("https://www.swapi.tech/api/starships/9/");

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const objectStarWars = await response.json();
                console.log("Exercise 3 Result:", objectStarWars.result);
                
                // Display the result
                resultDiv.innerHTML = `
                    <div class="space-y-3">
                        <h3 class="font-bold text-lg text-blue-600">${objectStarWars.result.name}</h3>
                        <div class="grid grid-cols-2 gap-3 text-sm">
                            <div><span class="font-semibold text-gray-700">Model:</span> ${objectStarWars.result.model}</div>
                            <div><span class="font-semibold text-gray-700">Manufacturer:</span> ${objectStarWars.result.manufacturer}</div>
                            <div><span class="font-semibold text-gray-700">Class:</span> ${objectStarWars.result.starship_class}</div>
                            <div><span class="font-semibold text-gray-700">Cost:</span> ${objectStarWars.result.cost_in_credits}</div>
                        </div>
                        <pre class="bg-gray-200 p-3 rounded text-xs overflow-auto max-h-48">${JSON.stringify(objectStarWars.result, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                console.error("Could not fetch starship data:", error);
                resultDiv.innerHTML = `<p class="text-red-600 font-semibold">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
