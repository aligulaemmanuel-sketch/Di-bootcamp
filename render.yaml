services:
  - type: web
    name: maliwise-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build:api
    startCommand: npm run db:deploy && npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: COOKIE_SAME_SITE
        value: none
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://maliwise-web.onrender.com
      - key: APP_URL
        value: https://maliwise-web.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_FROM
        sync: false

  - type: web
    name: maliwise-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run db:generate && npx next build
    staticPublishPath: ./out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://maliwise-api.onrender.com
