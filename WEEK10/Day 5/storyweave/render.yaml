# Render.com blueprint — create services manually or via `render deploy`
services:
  - type: web
    name: storyweave-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase: storyweave-db
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
  - type: static
    name: storyweave-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist

databases:
  - name: storyweave-db
    databaseName: storyweave
