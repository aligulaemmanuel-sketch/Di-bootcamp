services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maliwise
      POSTGRES_PASSWORD: maliwise_dev_only
      POSTGRES_DB: maliwise
    ports:
      - "5432:5432"
    volumes:
      - maliwise-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maliwise -d maliwise"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  maliwise-postgres:
