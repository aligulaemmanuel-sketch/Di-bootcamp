<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Coloring Squares</title>
</head>
<body>
  <h1>Coloring Squares</h1>
  
  <div id="palette" aria-label="Choose a color">
    <button class="color selected" data-color="#ef4444" style="--color: #ef4444" aria-label="Red"></button>
    <button class="color" data-color="#3b82f6" style="--color: #3b82f6" aria-label="Blue"></button>
    <button class="color" data-color="#22c55e" style="--color: #22c55e" aria-label="Green"></button>
    <button class="color" data-color="#eab308" style="--color: #eab308" aria-label="Yellow"></button>
    <button class="color" data-color="#000000" style="--color: #000000" aria-label="Black"></button>
    <button class="color" data-color="#ffffff" style="--color: #ffffff" aria-label="White"></button>
  </div>

  <div id="grid-container" aria-label="Drawing canvas"></div>

  <button id="clear-btn" type="button">Clear canvas</button>

  <script src="script.js"></script>
</body>
</html>
